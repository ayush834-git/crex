  <desc id="mi-desc">CREX team badge for Mumbai Indians</desc>
  <defs>
    <linearGradient id="mi-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004BA0" />
      <stop offset="100%" stop-color="#D1A94A" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#mi-gradient)" />
  <circle cx="80" cy="80" r="48" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.34)" stroke-width="2" />
  <text x="80" y="92" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="2">MI</text>
